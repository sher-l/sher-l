name: Refresh stats images

# 自渲染 stats.svg / graph.svg：数据来自 GitHub 官方 GraphQL API（永远可达），
# 不再依赖 github-readme-stats.vercel.app 等第三方共享实例（经常 503 导致 README 图裂开）。
# 每周一 04:00 (UTC+8) 自动刷新，也可手动触发。
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate stats.svg and graph.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name "sher-l"
          git config user.email "sher-l@users.noreply.github.com"
          git add stats.svg graph.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats images"
          git push
