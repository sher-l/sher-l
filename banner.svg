<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img" aria-label="IKL — R · Python · Linux · Bioinformatics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F1A"/>
      <stop offset="1" stop-color="#12362C"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8963E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C8963E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dustGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7A5F"/>
      <stop offset="1" stop-color="#6FC7A4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="158" rx="18" fill="url(#bg)" stroke="#C8963E" stroke-opacity="0.35"/>

  <!-- 金色光晕脉动 -->
  <circle cx="655" cy="80" r="88" fill="url(#glowGold)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 墨绿粒子漂浮 -->
  <circle cx="230" cy="130" r="3.5" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="14s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.5;0" keyTimes="0;0.08;0.6;1" dur="14s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="130" r="2.6" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="17s" begin="-5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.4;0" keyTimes="0;0.08;0.6;1" dur="17s" begin="-5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="130" r="4.2" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="12s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.5;0" keyTimes="0;0.08;0.6;1" dur="12s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="505" cy="130" r="2.8" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="16s" begin="-9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0.45;0" keyTimes="0;0.08;0.6;1" dur="16s" begin="-9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="130" r="3.2" fill="#3C9373">
    <animate attributeName="cy" values="150;10" dur="13s" begin="-7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.4;0" keyTimes="0;0.08;0.6;1" dur="13s" begin="-7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="130" r="3.8" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="18s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.5;0" keyTimes="0;0.08;0.6;1" dur="18s" begin="-2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="130" r="2.6" fill="url(#dustGreen)">
    <animate attributeName="cy" values="150;10" dur="15s" begin="-11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.4;0" keyTimes="0;0.08;0.6;1" dur="15s" begin="-11s" repeatCount="indefinite"/>
  </circle>
  <!-- 少量金粉点缀 -->
  <circle cx="275" cy="130" r="2.4" fill="#E8C97A">
    <animate attributeName="cy" values="150;10" dur="15s" begin="-8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.5;0" keyTimes="0;0.08;0.6;1" dur="15s" begin="-8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="130" r="2.2" fill="#E8C97A">
    <animate attributeName="cy" values="150;10" dur="19s" begin="-6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0.45;0" keyTimes="0;0.08;0.6;1" dur="19s" begin="-6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="715" cy="130" r="2.4" fill="#E8C97A">
    <animate attributeName="cy" values="150;10" dur="16s" begin="-13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.5;0" keyTimes="0;0.08;0.6;1" dur="16s" begin="-13s" repeatCount="indefinite"/>
  </circle>

  <text x="52" y="94" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="54" font-weight="700" fill="#E9F2ED">IKL</text>
  <text x="54" y="124" font-family="'Courier New', 'JetBrains Mono', monospace" font-size="15" fill="#6FC7A4">R · Python · Linux · Bioinformatics</text>
  <circle cx="40" cy="40" r="4" fill="#3C9373"/>
  <circle cx="806" cy="118" r="4" fill="#C8963E"/>
</svg>
